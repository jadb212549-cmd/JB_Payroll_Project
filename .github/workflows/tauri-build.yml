name: Build Tauri Portable EXE

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release on completion'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions: {}

jobs:
  build-windows:
    name: Build Windows Portable & Installer
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Setup Rust Stable Toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache Action
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Web Frontend Assets
        run: npm run build

      - name: Validate Frontend Build Output
        shell: powershell
        run: |
          Write-Host "Validating frontend build output..."
          $tauriConfPath = "src-tauri/tauri.conf.json"
          $distDir = "dist"
          if (Test-Path $tauriConfPath) {
            $conf = Get-Content $tauriConfPath -Raw | ConvertFrom-Json
            if ($conf.build -and $conf.build.distDir) {
              $rawDist = $conf.build.distDir
              $distDir = ($rawDist -replace '^\.\./', '') -replace '^\./', ''
            }
          }
          Write-Host "Detected frontend output directory: $distDir"
          if (-not (Test-Path $distDir)) {
            Write-Error "Frontend build completed but expected output directory was not found: $distDir"
            Get-ChildItem -Path "." -Force
            exit 1
          }
          Write-Host "--- Contents of $distDir ---"
          Get-ChildItem -Path $distDir -Recurse | Select-Object Name, Length, FullName | Format-Table -AutoSize
          if (-not (Test-Path "$distDir/index.html")) {
            Write-Error "CRITICAL: $distDir/index.html does not exist!"
            exit 1
          }
          Write-Host "Frontend build output validated successfully."

      - name: Pre-Build Diagnostics
        shell: powershell
        run: |
          Write-Host "=== RUNTIME DIAGNOSTICS ==="
          Write-Host "Node: $(node --version)"
          Write-Host "NPM: $(npm --version)"
          Write-Host "Tauri CLI: $(npm exec tauri --version)"
          Write-Host "Rustc: $(rustc --version)"
          Write-Host "Cargo: $(cargo --version)"
          Write-Host "=== INSTALLED RUST TARGETS ==="
          rustup target list --installed

          Write-Host "=== CARGO.TOML CONFIGURATION ==="
          Get-Content "src-tauri/Cargo.toml"

          Write-Host "=== TAURI.CONF.JSON CONFIGURATION ==="
          Get-Content "src-tauri/tauri.conf.json"

      - name: Validate Tauri Configuration
        shell: powershell
        run: |
          Write-Host "Validating Tauri configuration..."
          if (-not (Test-Path "src-tauri/tauri.conf.json")) {
            Write-Error "src-tauri/tauri.conf.json is missing!"
            exit 1
          }
          if (-not (Test-Path "src-tauri/Cargo.toml")) {
            Write-Error "src-tauri/Cargo.toml is missing!"
            exit 1
          }
          $conf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $targets = $conf.tauri.bundle.targets
          if ($targets -contains "portable") {
            Write-Error "Unsupported 'portable' bundle target found in tauri.conf.json."
            exit 1
          }
          Write-Host "Tauri configuration is valid. Bundle targets: $($targets -join ', ')"

      - name: Build Tauri Desktop Application (Windows MSVC)
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Locate and Stage Windows Artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "./dist-portable"
          New-Item -ItemType Directory -Force -Path "./dist-installer"

          $releasePath = "src-tauri/target/x86_64-pc-windows-msvc/release"
          if (-not (Test-Path $releasePath)) {
            $releasePath = "src-tauri/target/release"
          }

          Write-Host "Inspecting release directory: $releasePath"
          if (Test-Path $releasePath) {
            Get-ChildItem -Path $releasePath -File | Format-Table Name, Length
          }

          # Identify main application executable (exclude setup, installer, uninstaller, msi, build_script)
          $allExes = Get-ChildItem -Path $releasePath -File -Filter "*.exe" -ErrorAction SilentlyContinue
          $mainExe = $allExes | Where-Object {
            $_.Name -notmatch "setup" -and
            $_.Name -notmatch "installer" -and
            $_.Name -notmatch "uninstall" -and
            $_.Name -notmatch "unins" -and
            $_.Name -notmatch "build_script"
          } | Select-Object -First 1

          if (-not $mainExe) {
            Write-Error "CRITICAL: Standalone application executable was not found in $releasePath!"
            Write-Host "--- Complete target directory listing ---"
            if (Test-Path "src-tauri/target") {
              Get-ChildItem -Path "src-tauri/target" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
            }
            exit 1
          }

          Copy-Item -Path $mainExe.FullName -Destination "dist-portable/PayrollMaster-ERP-Windows-Portable.exe" -Force
          Write-Host "Staged Portable EXE: $($mainExe.Name) -> dist-portable/PayrollMaster-ERP-Windows-Portable.exe"

          # Identify NSIS Installer
          $nsisPath = "$releasePath/bundle/nsis"
          $nsisInstaller = $null
          if (Test-Path $nsisPath) {
            $nsisInstaller = Get-ChildItem -Path $nsisPath -Recurse -File -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }

          if (-not $nsisInstaller) {
            Write-Error "CRITICAL: NSIS installer was not found under $nsisPath!"
            Write-Host "--- Complete bundle directory listing ---"
            if (Test-Path "$releasePath/bundle") {
              Get-ChildItem -Path "$releasePath/bundle" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
            }
            exit 1
          }

          Copy-Item -Path $nsisInstaller.FullName -Destination "dist-installer/PayrollMaster-ERP-Windows-Installer.exe" -Force
          Write-Host "Staged NSIS Installer: $($nsisInstaller.Name) -> dist-installer/PayrollMaster-ERP-Windows-Installer.exe"

      - name: Validate Final Windows Artifacts
        shell: powershell
        run: |
          Write-Host "=== WINDOWS RELEASE ARTIFACTS ==="
          $portable = Get-Item "dist-portable/PayrollMaster-ERP-Windows-Portable.exe" -ErrorAction SilentlyContinue
          $installer = Get-Item "dist-installer/PayrollMaster-ERP-Windows-Installer.exe" -ErrorAction SilentlyContinue

          if (-not $portable -or $portable.Length -le 0) {
            Write-Error "Artifact Validation Failed: dist-portable/PayrollMaster-ERP-Windows-Portable.exe is missing or 0 bytes!"
            if (Test-Path "src-tauri/target") {
              Get-ChildItem -Path "src-tauri/target" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
            }
            exit 1
          }

          if (-not $installer -or $installer.Length -le 0) {
            Write-Error "Artifact Validation Failed: dist-installer/PayrollMaster-ERP-Windows-Installer.exe is missing or 0 bytes!"
            if (Test-Path "src-tauri/target") {
              Get-ChildItem -Path "src-tauri/target" -Recurse | Select-Object FullName, Length | Format-Table -AutoSize
            }
            exit 1
          }

          Get-ChildItem -Path "./dist-portable", "./dist-installer" -Recurse -File | Select-Object Name, Length, FullName | Format-Table -AutoSize

      - name: Upload Portable Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayrollMaster-ERP-Windows-Portable
          path: dist-portable/PayrollMaster-ERP-Windows-Portable.exe
          retention-days: 30

      - name: Upload NSIS Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayrollMaster-ERP-Windows-Installer
          path: dist-installer/PayrollMaster-ERP-Windows-Installer.exe
          retention-days: 30

  build-multiplatform:
    name: Build Multi-Platform Binaries (macOS & Linux)
    runs-on: ${{ matrix.platform.os }}
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Linux Dependencies (Ubuntu)
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache Action
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Web Frontend Assets
        run: npm run build

      - name: Build Tauri Desktop Bundle
        run: npm run tauri build -- --target ${{ matrix.platform.target }}

      - name: Stage Multiplatform Artifacts
        run: |
          mkdir -p dist-multiplatform
          if [ -d "src-tauri/target/${{ matrix.platform.target }}/release/bundle" ]; then
            find "src-tauri/target/${{ matrix.platform.target }}/release/bundle" -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.app" \) -exec cp {} dist-multiplatform/ \;
          fi
          ls -la dist-multiplatform/

      - name: Upload Multiplatform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PayrollMaster-ERP-${{ matrix.platform.os }}
          path: dist-multiplatform/*
          retention-days: 30

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-windows]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    permissions:
      contents: write

    steps:
      - name: Download Portable Executable Artifact
        uses: actions/download-artifact@v4
        with:
          name: PayrollMaster-ERP-Windows-Portable
          path: release-artifacts

      - name: Download NSIS Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: PayrollMaster-ERP-Windows-Installer
          path: release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          draft: false
          prerelease: false
          generate_release_notes: true
