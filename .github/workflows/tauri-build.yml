name: Build Tauri Portable EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-portable:
    name: Build Windows Portable Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Setup Rust Stable Toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache Action
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Pre-Build Diagnostics
        shell: powershell
        run: |
          Write-Host "=== RUNTIME ENVIRONMENT ==="
          Write-Host "Node: $(node --version)"
          Write-Host "NPM: $(npm --version)"
          Write-Host "Tauri CLI: $(npm exec tauri --version)"
          Write-Host "Rustc: $(rustc --version)"
          Write-Host "Cargo: $(cargo --version)"
          Write-Host "=== INSTALLED RUST TARGETS ==="
          rustup target list --installed

          Write-Host "=== SRC-TAURI DIRECTORY CONTENTS ==="
          Get-ChildItem src-tauri -Force

          Write-Host "=== TAURI.CONF.JSON CONFIGURATION ==="
          Get-Content src-tauri/tauri.conf.json

      - name: Build Web Frontend Assets
        run: npm run build

      - name: Validate Build Prerequisites
        shell: powershell
        run: |
          Write-Host "Validating frontend and configuration..."
          if (-not (Test-Path "dist/index.html")) {
            Write-Error "Frontend build failed: dist/index.html was not found."
            Get-ChildItem -Path "." -Force
            exit 1
          }
          if (-not (Test-Path "src-tauri/Cargo.toml")) {
            Write-Error "src-tauri/Cargo.toml is missing!"
            exit 1
          }
          if (-not (Test-Path "src-tauri/tauri.conf.json")) {
            Write-Error "src-tauri/tauri.conf.json is missing!"
            exit 1
          }
          Write-Host "Frontend output (dist) and Tauri configuration validated successfully."

      - name: Build Tauri Desktop Application (Windows MSVC)
        shell: powershell
        run: |
          try {
            npm run tauri build -- --target x86_64-pc-windows-msvc
            if ($LASTEXITCODE -ne 0) {
              throw "Tauri build failed with exit code $LASTEXITCODE"
            }
          } catch {
            Write-Error "Tauri build error: $_"
            Write-Host "=== TARGET DIRECTORY DIAGNOSTICS ON FAILURE ==="
            if (Test-Path "src-tauri/target") {
              Get-ChildItem -Path "src-tauri/target" -Force | Format-Table Name, Length, FullName
            }
            if (Test-Path "src-tauri/target/x86_64-pc-windows-msvc") {
              Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc" -Force | Format-Table Name, Length, FullName
            }
            exit 1
          }

      - name: Locate Exact Application Executable
        shell: powershell
        run: |
          # Parse package name from Cargo.toml
          $cargoContent = Get-Content "src-tauri/Cargo.toml" -Raw
          $pkgNameMatch = [regex]::Match($cargoContent, 'name\s*=\s*"([^"]+)"')
          if (-not $pkgNameMatch.Success) {
            Write-Error "Unable to determine package name from src-tauri/Cargo.toml"
            exit 1
          }
          $cargoBinaryName = "$($pkgNameMatch.Groups[1].Value).exe"
          Write-Host "Expected Cargo binary name: $cargoBinaryName"

          # Parse productName from tauri.conf.json
          $tauriConf = Get-Content "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json
          $productBinaryName = "$($tauriConf.package.productName).exe"
          Write-Host "Expected Tauri product binary name: $productBinaryName"

          $releasePath = "src-tauri/target/x86_64-pc-windows-msvc/release"
          if (-not (Test-Path $releasePath)) {
            $releasePath = "src-tauri/target/release"
          }

          Write-Host "Inspecting release directory: $releasePath"
          if (Test-Path $releasePath) {
            Write-Host "Found the following .exe files in release directory:"
            Get-ChildItem -Path $releasePath -File -Filter "*.exe" | Format-Table Name, Length, FullName
          } else {
            Write-Error "Release directory does not exist: $releasePath"
            exit 1
          }

          # Look for exact matching executable
          $targetExe = $null
          if (Test-Path "$releasePath/$cargoBinaryName") {
            $targetExe = Get-Item "$releasePath/$cargoBinaryName"
          } elseif (Test-Path "$releasePath/$productBinaryName") {
            $targetExe = Get-Item "$releasePath/$productBinaryName"
          }

          if (-not $targetExe) {
            Write-Error "CRITICAL: Neither '$cargoBinaryName' nor '$productBinaryName' was found in $releasePath!"
            Write-Host "All executables discovered in release path:"
            Get-ChildItem -Path $releasePath -File -Filter "*.exe" | Format-Table Name, Length, FullName
            exit 1
          }

          New-Item -ItemType Directory -Force -Path "./dist-portable"
          Copy-Item -Path $targetExe.FullName -Destination "dist-portable/PayrollMaster-ERP-Portable.exe" -Force
          Write-Host "Successfully staged executable: $($targetExe.FullName) -> dist-portable/PayrollMaster-ERP-Portable.exe"

      - name: Validate Portable Artifact
        shell: powershell
        run: |
          Write-Host "=== VALIDATING PORTABLE ARTIFACT ==="
          $portableFiles = Get-ChildItem -Path "./dist-portable" -File

          if ($portableFiles.Count -ne 1) {
            Write-Error "Validation failed: Expected exactly 1 file in dist-portable, found $($portableFiles.Count)."
            $portableFiles | Format-Table Name, Length, FullName
            exit 1
          }

          $file = $portableFiles[0]
          if ($file.Name -ne "PayrollMaster-ERP-Portable.exe") {
            Write-Error "Validation failed: Unexpected filename '$($file.Name)' (expected 'PayrollMaster-ERP-Portable.exe')."
            exit 1
          }

          if ($file.Extension -ne ".exe") {
            Write-Error "Validation failed: File extension is not .exe ($($file.Extension))."
            exit 1
          }

          if ($file.Length -le 0) {
            Write-Error "Validation failed: File size is 0 bytes."
            exit 1
          }

          Write-Host "Verified portable artifact:"
          Write-Host "  Name: $($file.Name)"
          Write-Host "  Size: $($file.Length) bytes ($([math]::Round($file.Length / 1MB, 2)) MB)"
          Write-Host "  Path: $($file.FullName)"

      - name: Upload Portable Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayrollMaster-ERP-Windows-Portable
          path: dist-portable/PayrollMaster-ERP-Portable.exe
          retention-days: 30
