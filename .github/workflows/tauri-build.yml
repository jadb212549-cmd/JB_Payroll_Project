name: Build Tauri Portable EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-portable:
    name: Build Windows Portable Executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Validate build prerequisites
        shell: powershell
        run: |
          if (-not (Test-Path "dist/index.html")) {
            throw "dist/index.html does not exist."
          }
          if (-not (Test-Path "src-tauri/Cargo.toml")) {
            throw "src-tauri/Cargo.toml does not exist."
          }
          if (-not (Test-Path "src-tauri/tauri.conf.json")) {
            throw "src-tauri/tauri.conf.json does not exist."
          }
          Write-Host "All build prerequisites validated."

      - name: Print diagnostics
        shell: powershell
        run: |
          node --version
          npm --version
          npm exec tauri --version
          rustc --version
          cargo --version

      - name: Build Tauri directly
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Package Portable Executable
        shell: powershell
        run: |
          $cargoContent = Get-Content "src-tauri/Cargo.toml" -Raw
          if ($cargoContent -match 'name\s*=\s*"([^"]+)"') {
            $binaryName = $matches[1]
          } else {
            throw "Failed to extract package name from src-tauri/Cargo.toml"
          }

          $exeName = "$binaryName.exe"
          $sourceExe = "src-tauri/target/x86_64-pc-windows-msvc/release/$exeName"

          if (-not (Test-Path $sourceExe)) {
            $fallback = Get-ChildItem -Path "src-tauri/target" -Filter $exeName -Recurse -File | Select-Object -First 1
            if ($fallback) {
              $sourceExe = $fallback.FullName
            } else {
              throw "Could not locate application executable $exeName"
            }
          }

          New-Item -ItemType Directory -Force -Path "dist-portable" | Out-Null
          $destExe = "dist-portable/PayrollMaster-ERP-Portable.exe"
          Copy-Item -Path $sourceExe -Destination $destExe -Force

          if (-not (Test-Path $destExe)) {
            throw "Validation failed: $destExe was not created."
          }

          $destItem = Get-Item $destExe
          if ($destItem.Length -le 0) {
            throw "Validation failed: $destExe size is 0 bytes."
          }

          $portableItems = Get-ChildItem -Path "dist-portable" -File
          if ($portableItems.Count -ne 1) {
            throw "Validation failed: dist-portable must contain exactly ONE file, found $($portableItems.Count)."
          }

          Write-Host "Successfully generated and verified: $($destItem.FullName) ($($destItem.Length) bytes)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayrollMaster-ERP-Windows-Portable
          path: dist-portable/PayrollMaster-ERP-Portable.exe
          if-no-files-found: error
