name: Build Tauri Portable EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-windows-portable:
    name: Build Windows Portable Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Setup Rust Stable Toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache Action
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Toolchain and Environment Diagnostics
        shell: powershell
        run: |
          Write-Host "=== NODE AND NPM VERSIONS ==="
          node --version
          npm --version

          Write-Host "=== TAURI CLI VERSION ==="
          npm exec tauri --version

          Write-Host "=== RUSTC VERBOSE INFO ==="
          rustc --version --verbose

          Write-Host "=== CARGO VERBOSE INFO ==="
          cargo --version --verbose

          Write-Host "=== RUSTUP SHOW ==="
          rustup show

          Write-Host "=== INSTALLED RUST TARGETS ==="
          rustup target list --installed

          Write-Host "=== WINDOWS MSVC LINKER / BUILD TOOLS DISCOVERY ==="
          Write-Host "Checking link.exe location:"
          where.exe link.exe
          Write-Host "Checking cl.exe location:"
          where.exe cl.exe
          Write-Host "Checking cargo.exe location:"
          where.exe cargo.exe

          Write-Host "=== TAURI DEPENDENCY TREE (CARGO TREE) ==="
          cargo tree --manifest-path src-tauri/Cargo.toml -i tauri

          Write-Host "=== CONFIGURATION: PACKAGE.JSON ==="
          Get-Content package.json

          Write-Host "=== CONFIGURATION: SRC-TAURI/CARGO.TOML ==="
          Get-Content src-tauri/Cargo.toml

          Write-Host "=== CONFIGURATION: SRC-TAURI/TAURI.CONF.JSON ==="
          Get-Content src-tauri/tauri.conf.json

      - name: Build Web Frontend Assets
        run: npm run build

      - name: Validate Frontend Output
        shell: powershell
        run: |
          Write-Host "=== VALIDATING FRONTEND ASSET OUTPUT ==="
          if (-not (Test-Path "dist/index.html")) {
            Write-Error "CRITICAL: dist/index.html was not found after frontend build!"
            Get-ChildItem -Path "." -Force
            exit 1
          }
          Write-Host "dist/index.html exists and is valid."

      - name: Execute Tauri Build with Deep Diagnostics
        shell: powershell
        run: |
          Write-Host "=== EXECUTING TAURI BUILD COMMAND ==="
          npm run tauri build -- --target x86_64-pc-windows-msvc 2>&1 | Tee-Object -FilePath tauri-build.log
          $tauriExitCode = $LASTEXITCODE
          Write-Host "Tauri build process exit code: $tauriExitCode"

          if ($tauriExitCode -ne 0) {
            Write-Host "===== TAURI BUILD FAILURE ====="
            if (Test-Path "tauri-build.log") {
              Get-Content tauri-build.log
            }

            Write-Host "=== EXTRACTED COMPILER & BUILD-SCRIPT ERRORS ==="
            $errorLines = @()
            if (Test-Path "tauri-build.log") {
              $errorLines = Select-String -Path tauri-build.log -Pattern "error:", "Caused by:", "error\[E", "panicked", "failed to run custom build command", "could not compile", "link.exe", "cl.exe"
              $errorLines | ForEach-Object { Write-Host $_.Line }
            }
            Write-Host "===== END TAURI BUILD FAILURE ====="

            Write-Host "=== CARGO TARGET DIRECTORY ==="
            if (Test-Path "src-tauri/target") {
              Get-ChildItem -Path "src-tauri/target" | Format-Table Name, Length, LastWriteTime
            }

            Write-Host "=== TARGET/X86_64-PC-WINDOWS-MSVC DIRECTORY ==="
            if (Test-Path "src-tauri/target/x86_64-pc-windows-msvc") {
              Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc" | Format-Table Name, Length, LastWriteTime
            }

            Write-Host "=== TARGET/X86_64-PC-WINDOWS-MSVC/RELEASE DIRECTORY ==="
            if (Test-Path "src-tauri/target/x86_64-pc-windows-msvc/release") {
              Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release" | Format-Table Name, Length, LastWriteTime
            }

            Write-Host "=== TARGET/X86_64-PC-WINDOWS-MSVC/RELEASE/BUILD DIRECTORY ==="
            if (Test-Path "src-tauri/target/x86_64-pc-windows-msvc/release/build") {
              Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/build" | Format-Table Name, Length, LastWriteTime
            }

            Write-Host "=== RUNNING DIRECT CARGO BUILD FOR COMPILER ERROR TRACING ==="
            cargo build --manifest-path src-tauri/Cargo.toml --release --target x86_64-pc-windows-msvc --verbose 2>&1 | Tee-Object -FilePath cargo-build.log
            $cargoExitCode = $LASTEXITCODE
            Write-Host "Direct cargo build exited with code: $cargoExitCode"

            if ($cargoExitCode -ne 0) {
              Write-Host "===== CARGO BUILD LOG START ====="
              if (Test-Path "cargo-build.log") {
                Get-Content cargo-build.log
              }
              Write-Host "===== CARGO BUILD LOG END ====="
            }

            # Generate GitHub Step Summary
            $tauriVer = (npm exec tauri --version 2>&1 | Out-String).Trim()
            $rustVer = (rustc --version 2>&1 | Out-String).Trim()
            $firstErrorLine = "No specific error line matched regex filter"
            if ($errorLines.Count -gt 0) {
              $firstErrorLine = ($errorLines | Select-Object -First 1).Line
            }

            $extractedSnippet = ($errorLines | Select-Object -First 25 | ForEach-Object { $_.Line }) -join "`n"
            if (-not $extractedSnippet) {
              $extractedSnippet = "Please inspect full tauri-build.log artifact"
            }

            $summaryMarkdown = @"
# Tauri Build Failure

## Tauri Version
````
$tauriVer
````

## Rust Version
````
$rustVer
````

## Target
x86_64-pc-windows-msvc

## First Error
````
$firstErrorLine
````

## Complete Error
````
$extractedSnippet
````

## Cargo Result
Exit Code: $cargoExitCode

## Tauri Result
Exit Code: $tauriExitCode
"@
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summaryMarkdown

            exit $tauriExitCode
          }

          Write-Host "=== TAURI BUILD COMPLETED SUCCESSFULLY ==="

      - name: Upload Build Diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tauri-Build-Diagnostics
          if-no-files-found: ignore
          path: |
            tauri-build.log
            cargo-build.log
            src-tauri/target/x86_64-pc-windows-msvc/release/build
