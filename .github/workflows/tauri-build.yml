name: Build Tauri Portable EXE

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows-portable:
    name: Build Windows Portable Executable
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Validate build prerequisites
        shell: powershell
        run: |
          if (-not (Test-Path "dist/index.html")) {
            throw "dist/index.html does not exist!"
          }
          if (-not (Test-Path "src-tauri/Cargo.toml")) {
            throw "src-tauri/Cargo.toml does not exist!"
          }
          if (-not (Test-Path "src-tauri/tauri.conf.json")) {
            throw "src-tauri/tauri.conf.json does not exist!"
          }
          Write-Host "Prerequisites validated successfully."

      - name: Tauri Build
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Locate, Copy, and Validate Portable Executable
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "dist-portable" | Out-Null

          $exePath = "src-tauri/target/x86_64-pc-windows-msvc/release/payroll-master-erp.exe"
          if (-not (Test-Path $exePath)) {
            $fallback = Get-ChildItem -Path "src-tauri/target" -Filter "payroll-master-erp.exe" -Recurse -File | Select-Object -First 1
            if ($null -ne $fallback) {
              $exePath = $fallback.FullName
            } else {
              throw "Could not locate payroll-master-erp.exe!"
            }
          }

          $destPath = "dist-portable/PayrollMaster-ERP-Portable.exe"
          Copy-Item -Path $exePath -Destination $destPath -Force

          if (-not (Test-Path $destPath)) {
            throw "Destination executable $destPath does not exist!"
          }

          $fileInfo = Get-Item $destPath
          if ($fileInfo.Length -le 0) {
            throw "Executable size is 0 bytes!"
          }

          if ($fileInfo.Extension -ne ".exe") {
            throw "File extension is not .exe!"
          }

          $portableFiles = Get-ChildItem -Path "dist-portable" -File
          if ($portableFiles.Count -ne 1) {
            throw "dist-portable does not contain exactly one file! Found: $($portableFiles.Count)"
          }

          Write-Host "Portable executable validated: $($fileInfo.FullName) ($($fileInfo.Length) bytes)"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayrollMaster-ERP-Windows-Portable
          path: dist-portable/PayrollMaster-ERP-Portable.exe
          if-no-files-found: error
