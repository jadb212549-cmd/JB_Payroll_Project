name: Build Tauri Portable EXE

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create GitHub Release on completion'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows-portable:
    name: Build Windows Portable Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Setup Rust Stable Toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache Action
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Web Frontend Assets
        run: npm run build

      - name: Pre-Build Diagnostics
        shell: powershell
        run: |
          Write-Host "=== NODE & NPM VERSION ==="
          node --version
          npm --version
          Write-Host "=== TAURI CLI VERSION ==="
          npm exec tauri --version
          Write-Host "=== RUST & CARGO VERSION ==="
          rustc --version
          cargo --version
          Write-Host "=== INSTALLED RUST TARGETS ==="
          rustup target list --installed
          Write-Host "=== TARGET DIRECTORY STATE ==="
          if (Test-Path "src-tauri/target") { Get-ChildItem "src-tauri/target" -Force }

      - name: Build Tauri Desktop Application (Windows MSVC)
        run: npm run tauri build -- --target x86_64-pc-windows-msvc

      - name: Inspect Build Outputs and Stage Artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "./dist-portable"
          New-Item -ItemType Directory -Force -Path "./dist-installer"

          Write-Host "--- Inspecting release directory ---"
          if (Test-Path "src-tauri/target/x86_64-pc-windows-msvc/release") {
            Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release" | Format-Table Name, Length
          }

          Write-Host "--- Inspecting bundle directory ---"
          if (Test-Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle") {
            Get-ChildItem "src-tauri/target/x86_64-pc-windows-msvc/release/bundle" -Recurse | Format-Table FullName, Length
          }

          # Locate Standalone Portable EXE (exclude setup, installer, uninstaller)
          $portableExe = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release" -File -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object {
            $_.Name -notmatch "setup" -and
            $_.Name -notmatch "installer" -and
            $_.Name -notmatch "uninstall"
          } | Select-Object -First 1

          if (-not $portableExe -and (Test-Path "src-tauri/target/release")) {
            $portableExe = Get-ChildItem -Path "src-tauri/target/release" -File -Filter "*.exe" -ErrorAction SilentlyContinue | Where-Object {
              $_.Name -notmatch "setup" -and
              $_.Name -notmatch "installer" -and
              $_.Name -notmatch "uninstall"
            } | Select-Object -First 1
          }

          if (-not $portableExe) {
            Write-Error "CRITICAL: Standalone Portable EXE was not found in release directory!"
            Get-ChildItem "src-tauri/target" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
            exit 1
          }

          Copy-Item -Path $portableExe.FullName -Destination "dist-portable/PayrollMaster-ERP-Windows-Portable.exe" -Force
          Write-Host "Staged Portable EXE: $($portableExe.FullName) -> dist-portable/PayrollMaster-ERP-Windows-Portable.exe"

          # Locate NSIS Installer
          $nsisInstaller = Get-ChildItem -Path "src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis" -Recurse -File -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $nsisInstaller -and (Test-Path "src-tauri/target/release/bundle/nsis")) {
            $nsisInstaller = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Recurse -File -Filter "*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }

          if (-not $nsisInstaller) {
            Write-Error "CRITICAL: NSIS Installer was not found in bundle/nsis directory!"
            Get-ChildItem "src-tauri/target" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue
            exit 1
          }

          Copy-Item -Path $nsisInstaller.FullName -Destination "dist-installer/PayrollMaster-ERP-Windows-Installer.exe" -Force
          Write-Host "Staged NSIS Installer: $($nsisInstaller.FullName) -> dist-installer/PayrollMaster-ERP-Windows-Installer.exe"

      - name: Verify Build Artifacts
        shell: powershell
        run: |
          Write-Host "=== BUILD ARTIFACT VERIFICATION ==="
          Get-ChildItem -Path "./dist-portable", "./dist-installer" -Recurse -File | Select-Object Name, Length, FullName | Format-Table -AutoSize

      - name: Upload Portable Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayrollMaster-ERP-Windows-Portable
          path: dist-portable/PayrollMaster-ERP-Windows-Portable.exe
          retention-days: 30

      - name: Upload NSIS Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayrollMaster-ERP-Windows-Installer
          path: dist-installer/PayrollMaster-ERP-Windows-Installer.exe
          retention-days: 30

  build-multiplatform:
    name: Build Multi-Platform Binaries (macOS & Linux)
    runs-on: ${{ matrix.platform.os }}
    needs: build-windows-portable
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        platform:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Engine
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install Linux Dependencies (Ubuntu)
        if: matrix.platform.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Rust Cache Action
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Frontend Assets
        run: npm run build

      - name: Build Tauri Desktop Bundle
        run: npm run tauri build -- --target ${{ matrix.platform.target }}

      - name: Stage Multiplatform Artifacts
        run: |
          mkdir -p dist-multiplatform
          find src-tauri/target/${{ matrix.platform.target }}/release/bundle -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.app" \) -exec cp {} dist-multiplatform/ \; 2>/dev/null || true

      - name: Upload Multiplatform Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PayrollMaster-ERP-${{ matrix.platform.os }}
          path: dist-multiplatform/*
          retention-days: 30
